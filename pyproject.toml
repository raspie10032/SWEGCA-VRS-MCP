[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swegca-vrs-mcp"
version = "2.2.0"
description = "Persistent experience, recall and SWEGCA/VRS tools for MCP agents"
requires-python = ">=3.11"
license = "MIT AND MPL-2.0"
license-files = ["LICENSE", "LICENSES/MPL-2.0.txt"]
readme = "README.md"
dependencies = ["numpy>=2,<3", "immutables>=0.21,<1"]

[project.optional-dependencies]
test = ["mcp>=2,<3", "pytest>=8", "pytest-asyncio>=0.24", "PyYAML>=6,<7"]
identity = ["cryptography>=42"]   # optional Ed25519 producer verification
core = ["torch>=2.6,<3", "numpy>=2,<3"]

[project.scripts]
swegca-vrs-mcp = "swegca_vrs2.server:main"
swegca-vrs2-mcp = "swegca_vrs2.server:main"
swegca-vrs2-codex = "swegca_vrs2.layered:main"
swegca-vrs2-hook = "swegca_vrs2.conversation_hooks:hook_main"
swegca-vrs2-codex-hooks = "swegca_vrs2.codex_hooks:main"

[project.urls]
Repository = "https://github.com/raspie10032/SWEGCA-VRS-MCP"

[tool.setuptools.packages.find]
where = ["src"]
include = ["swegca_vrs2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
