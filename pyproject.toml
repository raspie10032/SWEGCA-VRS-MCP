[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swegca-vrs-mcp"
version = "0.3.0"
description = "Persistent experience, recall and SWEGCA/VRS tools for MCP agents"
requires-python = ">=3.11"
license = "MIT AND MPL-2.0"
license-files = ["LICENSE", "LICENSES/MPL-2.0.txt"]
readme = "README.md"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "PyYAML>=6,<7"]
core = ["torch>=2.6,<3", "numpy>=2,<3", "filelock>=3,<4"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[project.scripts]
swegca-vrs-mcp = "swegca_vrs_mcp.server:main"
swegca-vrs-memory = "swegca_vrs_mcp.agent_service:main"

[project.urls]
Repository = "https://github.com/raspie10032/SWEGCA-VRS-MCP"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
