name: Standalone Windows and Linux
on:
  push:
    branches: [main, codex/windows-standalone-vrs2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build archives
        run: |
          python -m pip install build
          python -m build
          python tools/verify_standalone.py
      - name: Install only the built wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          python -m pip install "${wheel}[test]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify main and real MCP process persistence
        run: python -m pytest -q tests/standalone --junitxml=standalone.xml
      - name: Verify Windows installer and generated Claude paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          ./tools/install_windows.ps1 -PythonExecutable (Get-Command python).Source -Wheel $wheel
          $snippet = Join-Path $env:LOCALAPPDATA 'SWEGCA/vrs2-claude-config.json'
          $config = Get-Content -LiteralPath $snippet -Encoding utf8 -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $config.mcpServers.'vrs2-memory'.command)) { throw 'Generated executable path missing' }
      - name: Archive validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}-${{ matrix.python }}
          path: |
            standalone.xml
            dist/*
