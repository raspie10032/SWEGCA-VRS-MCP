[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vrs22-clean-checkpoint-fixture"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "immutables>=0.21,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
